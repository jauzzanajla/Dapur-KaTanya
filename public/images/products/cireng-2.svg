<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad)" rx="24"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="100" r="160" fill="#DC2626" opacity="0.08" />
  <circle cx="100" cy="500" r="120" fill="#DC2626" opacity="0.06" />

  <!-- Content Card -->
  <g transform="translate(100, 70)" filter="url(#shadow)">
    <rect width="600" height="460" rx="28" fill="#FFFFFF" />

    <!-- Top Badge -->
    <rect x="220" y="32" width="160" height="36" rx="18" fill="#DC2626" />
    <text x="300" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DAPUR KATANYA</text>

    <!-- Center Graphic Circle -->
    <g transform="translate(300, 200)">
      <circle cx="0" cy="0" r="95" fill="#FFFBEB" opacity="0.3" />
      <circle cx="0" cy="0" r="80" fill="#DC2626" opacity="0.12" />
      <path d="M-45,15 Q-20,-40 20,-30 Q60,-10 40,30 Q-10,50 -45,15 Z" fill="#FEF08A" stroke="#EAB308" stroke-width="4"/><path d="M-20,-10 Q0,20 25,0" stroke="#DC2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Title &amp; Subtitle -->
    <text x="300" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#1E293B" text-anchor="middle">Cireng Kuah Keju</text>
    <text x="300" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748B" text-anchor="middle">Crispy Golden Brown &amp; Chili Cheese</text>

    <!-- Bottom aesthetic bar -->
    <g transform="translate(175, 410)">
      <rect width="250" height="8" rx="4" fill="#DC2626" opacity="0.8" />
    </g>
  </g>
</svg>