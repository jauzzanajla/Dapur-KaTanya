<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF2F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad)" rx="24"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="100" r="160" fill="#EA580C" opacity="0.08" />
  <circle cx="100" cy="500" r="120" fill="#EA580C" opacity="0.06" />

  <!-- Content Card -->
  <g transform="translate(100, 70)" filter="url(#shadow)">
    <rect width="600" height="460" rx="28" fill="#FFFFFF" />

    <!-- Top Badge -->
    <rect x="220" y="32" width="160" height="36" rx="18" fill="#EA580C" />
    <text x="300" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DAPUR KATANYA</text>

    <!-- Center Graphic Circle -->
    <g transform="translate(300, 200)">
      <circle cx="0" cy="0" r="95" fill="#FEF2F2" opacity="0.3" />
      <circle cx="0" cy="0" r="80" fill="#EA580C" opacity="0.12" />
      <circle cx="-25" cy="-10" r="28" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/><circle cx="25" cy="-10" r="28" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/><circle cx="0" cy="15" r="28" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/><path d="M-45,35 Q0,55 45,35" stroke="#EA580C" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="300" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#1E293B" text-anchor="middle">Dimsum Kuah Keju</text>
    <text x="300" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748B" text-anchor="middle">Tampak Atas & Extra Keju Lumer</text>

    <!-- Bottom aesthetic bar -->
    <g transform="translate(175, 410)">
      <rect width="250" height="8" rx="4" fill="#EA580C" opacity="0.8" />
    </g>
  </g>
</svg>